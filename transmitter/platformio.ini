; DCF77 transmitter on Freenove ESP32-WROOM
[platformio]
default_envs = esp32dev

; Flash over USB: pio run -t upload
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
extra_scripts =
    pre:scripts/ota_signing.py
    pre:scripts/version.py

; Flash over WiFi: pio run -e ota -t upload
; Signs the firmware with your OTA signing key, see README.
[env:ota]
extends = env:esp32dev
upload_protocol = custom
upload_command = $PYTHONEXE scripts/ota_upload.py $SOURCE dcf77.local
